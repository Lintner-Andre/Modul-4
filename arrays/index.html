<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrays</title>
    <script>
      // Array erstellen
      // Array mit Startwerten füllen
      const liste = [5, 9, 3, 4];
      // Array auf der Konsole ausgeben
      console.log(liste);
      // Array mitt Werten füllen & Werte ausgeben
      liste.push(6);
      console.log(liste);
      // Array Werte entfernen
      const letzteElement = liste.pop();
      console.log(letzteElement);
      console.log(liste);
      // Spezifische ausgabe
      console.log(liste[0]);
    </script>
  </head>
  <body></body>
</html>
